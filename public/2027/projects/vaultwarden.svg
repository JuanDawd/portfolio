<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Homelab architecture: browser, Cloudflare Access, Cloudflare Tunnel, then a Proxmox server with LXC containers and Docker running Vaultwarden, Paperless-ngx and Nextcloud, with Pi-hole DNS and nightly snapshot backups">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1116"/>
      <stop offset="1" stop-color="#101a22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: ui-monospace, "SF Mono", Menlo, monospace; fill: #e2e8f0; }
      .t { font-size: 26px; font-weight: 600; }
      .s { font-size: 18px; fill: #94a3b8; }
      .box { fill: #16222c; stroke: #2b3f4e; stroke-width: 2; }
      .hl { fill: #12302e; stroke: #5eead4; stroke-width: 2; }
      .line { stroke: #5eead4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="640" y="84" text-anchor="middle" class="t" style="font-size:34px">Self-hosted homelab</text>
  <text x="640" y="122" text-anchor="middle" class="s">No open ports · zero-trust access</text>

  <rect class="box" x="40" y="300" width="200" height="130" rx="16"/>
  <text x="140" y="356" text-anchor="middle" class="t">Browser</text>
  <text x="140" y="390" text-anchor="middle" class="s">any device</text>

  <rect class="hl" x="300" y="300" width="210" height="130" rx="16"/>
  <text x="405" y="356" text-anchor="middle" class="t">Cloudflare</text>
  <text x="405" y="390" text-anchor="middle" class="s">Access (auth gate)</text>

  <rect class="hl" x="570" y="300" width="190" height="130" rx="16"/>
  <text x="665" y="356" text-anchor="middle" class="t">Tunnel</text>
  <text x="665" y="390" text-anchor="middle" class="s">outbound only</text>

  <rect class="box" x="820" y="160" width="420" height="440" rx="16"/>
  <text x="1030" y="204" text-anchor="middle" class="t">Proxmox server</text>

  <rect class="hl" x="845" y="226" width="370" height="196" rx="12"/>
  <text x="1030" y="262" text-anchor="middle" class="t" style="font-size:22px">LXC containers + Docker</text>
  <rect class="box" x="865" y="282" width="330" height="36" rx="8"/>
  <text x="1030" y="307" text-anchor="middle" class="s" style="font-size:16px">Vaultwarden</text>
  <rect class="box" x="865" y="326" width="330" height="36" rx="8"/>
  <text x="1030" y="351" text-anchor="middle" class="s" style="font-size:16px">Paperless-ngx</text>
  <rect class="box" x="865" y="370" width="330" height="36" rx="8"/>
  <text x="1030" y="395" text-anchor="middle" class="s" style="font-size:16px">Nextcloud · and more</text>

  <rect class="box" x="845" y="438" width="370" height="60" rx="12"/>
  <text x="1030" y="475" text-anchor="middle" class="s" style="font-size:16px">Pi-hole DNS · firewall rules</text>
  <rect class="box" x="845" y="514" width="370" height="60" rx="12"/>
  <text x="1030" y="551" text-anchor="middle" class="s" style="font-size:16px">Nightly snapshot backups</text>

  <path class="line" d="M240 365 H295"/>
  <path class="line" d="M510 365 H565"/>
  <path class="line" d="M760 365 H815"/>
</svg>
